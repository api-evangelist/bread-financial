  /api/transaction/{transactionID}:
    get:
      tags:
      - Transaction
      summary: Get Transaction by Transaction ID
      description: Get a single transaction based on its unique transaction ID.
      operationId: getTransactionByID
      security:
      - bearerAuthTransaction:
        - r:tx
      parameters:
      - name: transactionID
        in: path
        description: The ID of the transaction to perform the action on
        required: true
        schema:
          type: string
          format: uuid
          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
          externalDocs:
            description: RFC4122
            url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: Etag
        in: header
        description: The Etag (transaction revision) of the given transaction for use when using the If-Match header on transaction management endpoints.
        schema:
          type: string
      responses:
        '200':
          description: Data for a single transaction.
          content:
            application/json:
              schema:
                description: Transaction is a representation of a single transaction
                required:
                - adjustedAmount
                - applicationID
                - billingContact
                - buyerID
                - createdAt
                - discountAmount
                - expirationExtended
                - externalID
                - id
                - merchantID
                - metadata
                - paymentAgreementID
                - paymentProductID
                - merchantPaymentProductValuesID
                - productType
                - programID
                - merchantProgramValuesID
                - refundedAmount
                - chargedbackAmount
                - cancelledAmount
                - settledAmount
                - overflowAmount
                - shippingAmount
                - shippingContact
                - status
                - taxAmount
                - tenantID
                - isCarts
                - totalAmount
                - revision
                - updatedAt
                properties:
                  adjustedAmount:
                    description: The transaction amount after adjustments.
                    allOf:
                    - required:
                      - currency
                      - value
                      properties:
                        currency:
                          type: string
                          description: The three letter currency code as defined in ISO 4217.
                          example: USD
                          minLength: 3
                          maxLength: 3
                          externalDocs:
                            description: ISO 4217
                            url: https://en.wikipedia.org/wiki/ISO_4217
                        value:
                          type: integer
                          description: 'Monetary value as an integral number of the currency fractional unit e.g for USD: cents'
                          format: int64
                          example: 100
                      description: Represents a monetary amount in the specified currency
                      example:
                        currency: USD
                        value: 50000
                  applicationID:
                    description: The application ID used to make the transaction
                    allOf:
                    - type: string
                      format: uuid
                      description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
                      example: dc0dc633-1760-4d43-ba1d-da94ed701f06
                      externalDocs:
                        description: RFC4122
                        url: https://datatracker.ietf.org/doc/html/rfc4122.html
                  billingContact:
                    description: The contact information of the person being billed.
                    allOf:
                    - type: object
                      required:
                      - name
                      properties:
                        name:
                          required:
                          - familyName
                          - givenName
                          type: object
                          properties:
                            givenName:
                              type: string
                              description: Given name
                              example: John
                            familyName:
                              type: string
                              description: Family name
                              example: Doe
                            additionalName:
                              type: string
                              description: Additional name, if any
                          description: Represents the full name
                        phone:
                          type: string
                          description: Telephone number including country code
                          example: '+14539842345'
                        address:
                          required:
                          - address1
                          - locality
                          - postalCode
                          - region
                          - country
                          type: object
                          properties:
                            address1:
                              type: string
                              description: First address line
                              example: 156 5th Avenue
                            address2:
                              type: string
                              description: Second address line
                            locality:
                              type: string
                              description: The locality (e.g. City) of the address.
                              example: New York
                            postalCode:
                              type: string
                              description: The administrative postal code (e.g. Zip Code)
                              example: '10019'
                            region:
                              type: string
                              description: The region or first-level administration division (e.g. State/Province) of the address.
                              example: US-NY
                              minLength: 2
                              externalDocs:
                                description: ISO-3166-2
                                url: https://en.wikipedia.org/wiki/ISO_3166-2
                            country:
                              type: string
                              description: The two character ISO-3166-1 country code.
                              example: US
                              minLength: 2
                              maxLength: 2
                              externalDocs:
                                description: ISO-3166-1
                                url: https://en.wikipedia.org/wiki/ISO_3166-1
                          description: Represents a fully defined address for an entity
                        email:
                          type: string
                          format: email
                          description: Email address
                          example: john.doe@gmail.com
                      description: Represents contact information for an entity
                  buyerID:
