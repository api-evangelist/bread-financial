        '401':
          description: Unauthorized. Indicates that provided credentials is not valid
          content:
            text/plain:
              schema:
                type: string
                example: Jwt is expired
            application/json:
              schema:
                allOf:
                - required:
                  - code
                  - domain
                  - message
                  type: object
                  properties:
                    code:
                      type: integer
                      description: The underlying http status code
                      format: int32
                      example: 500
                    message:
                      type: string
                      description: A simple message in english describing the error and can be returned to the consumer
                      example: Age cannot be less than 18
                    domain:
                      type: string
                      description: The domain where the error is originating from as defined by the service
                      example: Payments
                    metadata:
                      type: object
                      additionalProperties:
                        type: string
                      description: Any additional details to be conveyed as determined by the service. If present, will return map of key value pairs
                      example:
                        propertyName: propertyName is required
                required:
                - code
                - domain
                - message
                - reason
                type: object
                properties:
                  reason:
                    type: string
                    description: A reason code specific to the service and can be used to identify the exact issue. Should be unique within a domain
                    example: Reason_Code
              example:
                code: 401
                domain: Auth
                message: Invalid authentication
                reason: Invalid_Authentication
        '403':
          description: Forbidden. Indicates that request cannot be authorized
          content:
            text/plain:
              schema:
                type: string
                example: 'RBAC: Access Denied'
            application/json:
              schema:
                allOf:
                - required:
                  - code
                  - domain
                  - message
                  type: object
                  properties:
                    code:
                      type: integer
                      description: The underlying http status code
                      format: int32
                      example: 500
                    message:
                      type: string
                      description: A simple message in english describing the error and can be returned to the consumer
                      example: Age cannot be less than 18
                    domain:
                      type: string
                      description: The domain where the error is originating from as defined by the service
                      example: Payments
                    metadata:
                      type: object
                      additionalProperties:
                        type: string
                      description: Any additional details to be conveyed as determined by the service. If present, will return map of key value pairs
                      example:
                        propertyName: propertyName is required
                required:
                - code
                - domain
                - message
                - reason
                type: object
                properties:
                  reason:
                    type: string
                    description: A reason code specific to the service and can be used to identify the exact issue. Should be unique within a domain
                    example: Reason_Code
              example:
                code: 403
                domain: Auth
                message: 'RBAC: Access Denied'
                reason: Access_Denied
        '500':
          description: Payments encountered an error while processing your request.
          content:
            application/json:
              schema:
                required:
                - code
                - domain
                - message
                type: object
                properties:
                  code:
                    type: integer
                    description: The underlying http status code
                    format: int32
                    example: 500
                  message:
                    type: string
                    description: A simple message in english describing the error and can be returned to the consumer
                    example: Age cannot be less than 18
                  domain:
                    type: string
                    description: The domain where the error is originating from as defined by the service
                    example: Payments
                  metadata:
                    type: object
                    additionalProperties:
                      type: string
                    description: Any additional details to be conveyed as determined by the service. If present, will return map of key value pairs
                    example:
                      propertyName: propertyName is required
      parameters:
      - description: API version
        in: header
        name: X-API-VERSION
        required: true
        schema:
          type: string
        example: v2
      requestBody:
        description: Request body for creating a payment method
        content:
          application/json:
            schema:
              description: A request to create a payment method.  Only one of the sub models, BankAccount and CardAccount, should be used, and paymentMethodType should identify which one was used.
              required:
              - scopeID
              - paymentMethodType
              properties:
                scopeID:
                  allOf:
                  - type: string
                    format: uuid
                    description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
                    example: dc0dc633-1760-4d43-ba1d-da94ed701f06
                    externalDocs:
                      description: RFC4122
                      url: https://datatracker.ietf.org/doc/html/rfc4122.html
                  description: A unique scope identifier that should correlate to scopeType. For example, a buyer id or merchant id.
                name:
                  type: string
                  description: This is the nickname for the payment method.
                  example: John Doe Checking Account
                scopeType:
                  type: string
                  enum:
                  - UNKNOWN_SCOPE_TYPE
                  - BUYER
                  - MERCHANT
                  - PROGRAM_AGREEMENT
                  - PARTNER
                  default: UNKNOWN_SCOPE_TYPE
                  description: Identifies the owner of the payment method.
                  example: BUYER
                paymentMethodType:
                  type: string
                  enum:
                  - UNKNOWN_PAYMENT_METHOD_TYPE
                  - BANK_ACCOUNT
                  - CARD_ACCOUNT
                  - BANK_ACCOUNT_AUTHENTICATED
                  - CHECK_PAYMENT
                  - EXTERNAL_COLLECTION
                  - TRADE_IN_CREDIT
                  - MANUAL_PAYMENT
                  - PAPER_CHECK
                  default: UNKNOWN_PAYMENT_METHOD_TYPE
                  description: A high level category of the form of payments.
                  example: BANK_ACCOUNT_AUTHENTICATED
                bankAccount:
                  type: object
                  description: A request to create a bank account.  Will be used as part of the CreatePaymentMethodRequest.
                  required:
                  - bankName
                  - country
                  - currency
                  - accountType
                  - accountNumber
                  - routingNumber
                  - setupType
                  properties:
                    bankName:
                      type: string
                      description: This is the name of the bank that holds the account to be created.
                      example: Bread National Bank
                    accountType:
                      type: string
                      enum:
                      - UNKNOWN_ACCOUNT_TYPE
                      - CHECKING
                      - SAVINGS
                      description: Identifies the type of the account.
                      example: CHECKING
                    setupType:
                      type: string
                      enum:
                      - UNKNOWN_SETUP_TYPE
                      - ACH
                      - EFT
                      default: UNKNOWN_SETUP_TYPE
                      description: Identifies the way funds are transferred.
                      example: ACH
                    accountNumber:
                      type: string
                      description: This is the account number provided by the bank for the account being created.
                    routingNumber:
                      type: string
                      description: This is the routing number that is assigned to the banking institution for the account being created.
                    country:
                      allOf:
                      - type: string
                        description: The two character ISO-3166-1 country code.
                        example: US
                        minLength: 2
                        maxLength: 2
                        externalDocs:
                          description: ISO-3166-1
                          url: https://en.wikipedia.org/wiki/ISO_3166-1
                      description: The country code for this bank account's location.
                    currency:
                      allOf:
                      - type: string
                        description: The three letter currency code as defined in ISO 4217.
                        example: USD
                        minLength: 3
                        maxLength: 3
                        externalDocs:
                          description: ISO 4217
                          url: https://en.wikipedia.org/wiki/ISO_4217
                      description: The type of currency used with this bank account.
                bankAccountAuthenticated:
                  type: object
                  description: A request to create a bank account with a third party.  Will be used as part of the CreatePaymentMethodRequest.
                  properties:
                    accountID:
                      type: string
                      description: This is the identification number for a payment method within a customer account provided by a third party authorization program.
                    connectionID:
                      type: string
                      description: This is a one-time identification number provided to lookup a newly created customer account in a third party authorization program.
                    provider:
                      type: string
                      enum:
                      - UNKNOWN_PROVIDER
                      - MANUAL
                      - FLINKS
                      default: UNKNOWN_PROVIDER
                      description: This is the third party authorization program used to authorize the bank account.
                      example: FLINKS
                cardAccount:
                  type: object
                  description: A request to create a card account.  Will be used as part of the CreatePaymentMethodRequest.
                  properties:
                    cardType:
                      type: string
                      enum:
                      - UNKNOWN_CARD_TYPE
                      - CREDIT
                      - DEBIT
                      default: UNKNOWN_CARD_TYPE
                      description: The type of card that is being used.
                      example: DEBIT
                    provider:
                      type: string
                      enum:
                      - UNKNOWN_PROVIDER
                      - MANUAL
                      - CYBERSOURCE
                      - EPX
                      - VGS
                      default: UNKNOWN_PROVIDER
                      description: This is the name of the third party processor that is being used for the card account.
                      example: CYBERSOURCE
                    nonce:
                      type: string
                      description: This is a one time use identification number for the card account that is being created.
                    postalCode:
                      type: string
                      description: Postal code for billing address
                      example: 02139
                    expMonth:
                      type: string
                      description: The two digit month that the card expires in.
                      example: 01 or 11
                    expYear:
                      type: string
                      description: The two or four digit year that the card expires in.
                      example: 25 or 2025
                checkPayment:
                  type: object
                  description: A request to create a check payment.  Will be used as part of the CreatePaymentMethodRequest.
                  properties:
                    checkNumber:
                      type: string
                      description: This is the number associated to the check.
                    checkName:
                      type: string
                      description: This is the name associated to the check.
                    memo:
                      type: string
                      description: This is the description of the purpose of the check.
                    collectedTs:
                      allOf:
                      - type: string
                        format: date-time
                        description: The timestamp value formatted per RFC3339. This does not allow nulls.
                        example: '2020-12-31T15:10:55Z'
                        externalDocs:
                          description: RFC3339
                          url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
                      description: The timestamp of when this check payment was collected.
                manualPayment:
