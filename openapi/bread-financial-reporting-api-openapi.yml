                                  count:
                                    type: integer
                                    description: number of loans
                                    example: 100
                                  percentage:
                                    type: string
                                    description: percentage of overall loans that this product type comprises
                                    example: '27.4'
                                example:
                                  type: INSTALLMENTS
                                  amount:
                                    currency: USD
                                    value: 42707400
