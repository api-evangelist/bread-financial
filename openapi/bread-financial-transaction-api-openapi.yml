  /api/transaction/{transactionID}/rescind:
    post:
      tags:
      - Transaction
      summary: Rescind Transaction
      description: Rescind a single transaction based on its unique transaction ID.
      operationId: rescindTransaction
      security:
      - bearerAuthTransaction:
        - c:tx.rescind
      parameters:
      - name: transactionID
        in: path
        description: The ID of the transaction to perform the action on
        required: true
        schema:
          type: string
          format: uuid
          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
          externalDocs:
            description: RFC4122
            url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: If-Match
        in: header
        description: Only perform the given action if the current transaction revision (The Etag) matches the given string. A Precondition Failed (412) status code will be returned if the revision doesn’t match.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Data for a single transaction.
          content:
