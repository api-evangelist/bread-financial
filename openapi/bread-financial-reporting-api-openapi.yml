          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
          externalDocs:
            description: RFC4122
            url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: programID.eq
        in: query
        description: Query items belonging to provided identifier(s) of the program(s).
        explode: true
        schema:
          type: array
          minItems: 0
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: effectiveDate.gt
        in: query
        description: Query items with effective dates after provided date.
        schema:
          type: string
          format: date
