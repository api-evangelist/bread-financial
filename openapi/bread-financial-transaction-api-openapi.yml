    patch:
      tags:
      - Transaction
      summary: Update Transaction
      description: Update a single transaction based on its unique transaction ID.
      operationId: updateTransaction
      security:
      - bearerAuthTransaction:
        - u:tx
      parameters:
      - name: transactionID
        in: path
        description: The ID of the transaction to perform the action on
        required: true
        schema:
          type: string
          format: uuid
          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
          externalDocs:
            description: RFC4122
            url: https://datatracker.ietf.org/doc/html/rfc4122.html
      requestBody:
        required: false
        content:
          application/json:
            schema:
              description: Object to modify an existing transaction.
              properties:
                externalID:
                  type: string
                  description: An identifier that has significance to the Merchant allowing the transaction to be associated with the Merchant’s systems.
                  example: 55ed9cfd-f01e-487d-8d1a-6d0608189796
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                  description: 'Metadata is a JSON field available to merchants for storing external data on a Transaction

                    Metadata keys have a max size of 128, and there can be up to 50 keys total. The max value size for a key is 5000.'
                  example:
                    externalMerchantData: externalInfo
              example:
                externalID: c024d003-cf08-4d18-9a69-def501015bdb
                metadata:
                  externalMerchantData: externalInfo
      responses:
        '200':
          description: Data for a single transaction.
          content:
            application/json:
              schema:
                description: Transaction is a representation of a single transaction
                required:
                - adjustedAmount
                - applicationID
                - billingContact
                - buyerID
                - createdAt
                - discountAmount
                - expirationExtended
                - externalID
                - id
                - merchantID
                - metadata
                - paymentAgreementID
                - paymentProductID
                - merchantPaymentProductValuesID
                - productType
                - programID
                - merchantProgramValuesID
                - refundedAmount
                - chargedbackAmount
                - cancelledAmount
                - settledAmount
                - overflowAmount
                - shippingAmount
                - shippingContact
                - status
                - taxAmount
                - tenantID
                - isCarts
                - totalAmount
                - revision
                - updatedAt
                properties:
                  adjustedAmount:
                    description: The transaction amount after adjustments.
                    allOf:
                    - required:
                      - currency
                      - value
                      properties:
                        currency:
                          type: string
                          description: The three letter currency code as defined in ISO 4217.
                          example: USD
                          minLength: 3
                          maxLength: 3
                          externalDocs:
                            description: ISO 4217
                            url: https://en.wikipedia.org/wiki/ISO_4217
                        value:
                          type: integer
                          description: 'Monetary value as an integral number of the currency fractional unit e.g for USD: cents'
                          format: int64
                          example: 100
                      description: Represents a monetary amount in the specified currency
                      example:
                        currency: USD
                        value: 50000
                  applicationID:
                    description: The application ID used to make the transaction
                    allOf:
                    - type: string
                      format: uuid
                      description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
                      example: dc0dc633-1760-4d43-ba1d-da94ed701f06
                      externalDocs:
                        description: RFC4122
                        url: https://datatracker.ietf.org/doc/html/rfc4122.html
                  billingContact:
                    description: The contact information of the person being billed.
                    allOf:
                    - type: object
                      required:
                      - name
                      properties:
                        name:
                          required:
                          - familyName
                          - givenName
                          type: object
                          properties:
                            givenName:
                              type: string
                              description: Given name
                              example: John
                            familyName:
                              type: string
                              description: Family name
                              example: Doe
