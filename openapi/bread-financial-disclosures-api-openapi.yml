  /api/disclosure/document/{disclosureName}/payment-agreement/{paymentAgreementID}:
    get:
      summary: Get latest disclosure by agreement ID and disclosure name
      description: Return the current version of the given disclosure for the given agreement, determined by most recent creation time
      operationId: getDisclosureByAgreementAndName
      tags:
      - Disclosures
      security:
      - bearerAuthDisclosure:
        - r:disclosure.document
      parameters:
      - in: header
        name: X-API-VERSION
        description: 'X-API-VERSION: Header to specify the API version (i.e. v2)'
        schema:
          type: string
        required: true
      - name: paymentAgreementID
        description: The unique UUID of the payment agreement
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
          externalDocs:
            description: RFC4122
            url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: disclosureName
        in: path
        description: The name of the required disclosure
        required: true
        schema:
          description: A symbol identifying a disclosure document type
          type: string
          enum:
          - loan-agreement
          - loan-agreement-sp
          - cob-activation
          - cob-maintenance
          - one-time
          - auto-enroll
          - auto-enroll-sp
          - auto-enroll-pending
          - scheduled-payment
          - tila
          - credit-score-notice
          - auto-enroll-past-due
          - auto-enroll-past-due-sp
          - payment-full-terms
          - copy-of-authorization
          - copy-of-authorization-sp
          - checkout-auto-enroll-sp
          - hardship-confirm-0
          - hardship-confirm-29
          - hardship-confirm-59
          - verification-service
          - poa
          - payment-confirm
          - statement-hyloc
          - loan-agreement-hyloc
          - tila-hyloc
          - auto-enroll-full-terms
          - statement-di
          - loan-agreement-di
          - tila-di
          - ''
          example: loan-agreement
      - name: formatter
        in: query
        description: Specifies the format of the response. If set to 'pdf', the response will be returned as a PDF. Otherwise, will default to returning HTML/TEXT format.
        required: false
        schema:
          type: string
          example: pdf
      - name: before
        in: query
        description: Get the latest version generated on or before the specified timestamp (RFC3339 format)
        required: false
        schema:
          type: string
          format: date-time
          description: The timestamp value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31T15:10:55Z'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: estimated
        in: query
        required: false
        allowEmptyValue: true
        description: If true, return the latest estimated version of the disclosure.
        schema:
          type: boolean
      responses:
        '200':
          description: OK. The rendered disclosure markup.
          content:
            text/html:
              schema:
                type: string
                example: "<html lang=\"en\"> <head>\n <title>Truth In Lending Disclosure Statement</title>\n </head>\n <body>\n <div>\n <h1>TRUTH IN LENDING DISCLOSURE STATEMENT</h1>\n <div class=\"flex\">\n <div class=\"small-width\" data-testId=\"creditor\">\n <strong>Creditor:</strong><br />\n Comenity Capital Bank<br />\n PO Box 11499<br />\n Tampa, FL 33680<br />\n </div>\n </div>\n {{ end }}\n </div>\n </body></html>"
            text/plain:
              schema:
                type: string
                example: Truth In Lending Disclosure Statement
            application/pdf:
              schema:
                type: string
                format: binary
                description: The disclosure document rendered as a PDF file.
        '400':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - required:
                  - code
                  - domain
                  - message
                  type: object
                  properties:
                    code:
