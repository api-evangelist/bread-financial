  /api/transaction/{transactionID}/refund:
    post:
      tags:
      - Transaction
      summary: Refund Transaction
      description: Refund a single transaction based on its unique transaction ID.
      operationId: refundTransaction
      security:
      - bearerAuthTransaction:
        - c:tx.refund
      parameters:
      - name: transactionID
        in: path
        description: The ID of the transaction to perform the action on
        required: true
        schema:
          type: string
          format: uuid
          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
          externalDocs:
            description: RFC4122
            url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: If-Match
        in: header
        description: Only perform the given action if the current transaction revision (The Etag) matches the given string. A Precondition Failed (412) status code will be returned if the revision doesn’t match.
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              description: Object for performing actions like authorizations, refunds, and cancellations.
              type: object
              required:
              - amount
              properties:
                amount:
                  required:
                  - currency
                  - value
                  properties:
                    currency:
                      type: string
                      description: The three letter currency code as defined in ISO 4217.
                      example: USD
                      minLength: 3
                      maxLength: 3
                      externalDocs:
                        description: ISO 4217
                        url: https://en.wikipedia.org/wiki/ISO_4217
                    value:
                      type: integer
                      description: 'Monetary value as an integral number of the currency fractional unit e.g for USD: cents'
                      format: int64
                      example: 100
                  description: Represents a monetary amount in the specified currency
                  example:
                    currency: USD
                    value: 50000
                isVirtualCard:
                  type: boolean
                  default: false
                  description: Boolean representing whether or not this is a virtual credit card
                merchantOfRecordID:
                  description: UUID of the merchant of record for the action requested on the transaction
                  allOf:
                  - type: string
                    format: uuid
                    description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
                    example: dc0dc633-1760-4d43-ba1d-da94ed701f06
                    externalDocs:
                      description: RFC4122
                      url: https://datatracker.ietf.org/doc/html/rfc4122.html
                merchantNote:
                  type: string
                  description: An optional field for adding contextual information to the action.
                  maxLength: 512
              example:
                amount:
                  currency: USD
                  value: 24299
                isVirtualCard: true
                merchantOfRecordID: 6c371d7a-163e-4731-a009-5ef8ca794ff0
                merchantNote: merchant note
      responses:
        '200':
          description: Data for a single transaction.
          content:
            application/json:
              schema:
                description: Transaction is a representation of a single transaction
                required:
                - adjustedAmount
                - applicationID
                - billingContact
                - buyerID
                - createdAt
                - discountAmount
                - expirationExtended
                - externalID
                - id
                - merchantID
                - metadata
                - paymentAgreementID
                - paymentProductID
                - merchantPaymentProductValuesID
                - productType
                - programID
                - merchantProgramValuesID
                - refundedAmount
                - chargedbackAmount
                - cancelledAmount
                - settledAmount
                - overflowAmount
                - shippingAmount
                - shippingContact
                - status
                - taxAmount
                - tenantID
                - isCarts
                - totalAmount
                - revision
                - updatedAt
                properties:
                  adjustedAmount:
