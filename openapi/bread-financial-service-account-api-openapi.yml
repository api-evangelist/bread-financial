openapi: 3.2.0
info:
  title: Buyer Management Service Account API
  description: Management of buyers and their associated details. Provides additional fraud management capabilities around whitelisting and self cure.
  version: 2.0.0
  contact:
    email: partnership-growth@getbread.com
servers:
- url: https://api-preview.platform.breadpayments.com/
  description: Preview environment
- url: https://api.platform.breadpayments.com/
  description: Production environment
tags:
- name: Service Account
paths:
  /api/buyer/{id}/creditReport/{cra}:
    get:
      security:
      - bearerAuthBuyer:
        - r:buyer
      description: 'Allows a service account user to retrieve information from a given buyer''s credit report.


        - Non-existent buyer IDs, tenant IDs, and providers will return 404 Not Found.

        - Out of scope buyer IDs will return 401 Unauthorized.


        **JWT Claim Authorization:**

        **TenantID**: Required (non-nil); scopes results to the caller''s tenant.

        **BuyerID**: If non-nil in token, must exactly match the path `{id}`; a mismatch returns 401. A nil token `buyerID` passes the check.'
      x-operation-details:
        summary: Allows a service account user to retrieve information from a given buyer's credit report.
        behavior:
        - details:
          - Non-existent buyer IDs, tenant IDs, and providers will return 404 Not Found.
          - Out of scope buyer IDs will return 401 Unauthorized.
        authorization:
        - claim: TenantID
          description: Required (non-nil); scopes results to the caller's tenant.
        - claim: BuyerID
          description: If non-nil in token, must exactly match the path `{id}`; a mismatch returns 401. A nil token `buyerID` passes the check.
      tags:
      - Service Account
      summary: Get credit report data via service account
      operationId: getCreditReportData
      parameters:
      - description: Buyer ID
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: Credit reporting agency to get credit report from
        name: cra
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The creditReportData associated with this buyer ID and CRA.
          content:
            application/json:
              schema:
                description: 'CreditReportData contains the values for requested keys in a credit

                  report, KeyValues represents a map of fields as keys to raw JSON strings

                  as values'
                type: object
                properties:
                  CreditReportID:
                    description: Unique ID associated with this credit report data.
                    type: string
                    format: uuid
                    readOnly: true
                  KeyValueMap:
                    description: 'KeyValuesMap contains a map of JSON path keys as strings to raw JSON

                      values as strings and is used to return credit report information'
                    type: object
                    additionalProperties:
                      type: string
                  Provider:
                    description: Represents the credit report provider.
                    type: string
