  description: The merchant-facing transaction lifecycle — authorize, settle, refund, cancel, rescind, extend expiration — plus carts, fulfillment detail, and settlement/funding/targeting reporting exports. Transaction state changes are guarded by an ETag/If-Match revision check that answers 412 on a mismatch. 32 operations.
