                  message: retrieving disclosure record
                  reason: RESOURCE_NOT_FOUND
        '401':
          description: Unauthorized. Indicates that provided credentials is not valid
          content:
            text/plain:
              schema:
                type: string
                example: Jwt is expired
            application/json:
              schema:
                allOf:
