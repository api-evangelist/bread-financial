        required: true
        in: query
        description: The sort key.
        schema:
          description: The possible sort keys for listing Transactions
          type: string
          enum:
          - createdAt.asc
          - createdAt.desc
          - billingContact.asc
          - billingContact.desc
          - status.asc
          - status.desc
          - expiresAt.asc
          - expiresAt.desc
      - name: groupID.eq
        in: query
        description: The unique identifier(s) of the group(s) which is used to fetch transactions made from the locations belonging to these groups.
        style: form
        explode: true
        schema:
          type: array
          minItems: 0
          maxItems: 1
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
