- name: BreadPay Platform API
  description: >-
    Next-generation Bread Pay REST API for managing buyers, merchant accounts, personalized payment options
    and pricing, and the merchant transaction lifecycle (authorize, capture, cancel, refund). Secured
    with OAuth 2.0 client-credentials; access tokens are JWTs. Production and preview environments are
    available.
