        schema:
          type: string
      - name: externalID.like
        in: query
        description: external ID matching given pattern.
        schema:
          type: string
        example: 123%
      - name: billingContact.like
        in: query
        description: Billing contact matching given pattern.
        schema:
          type: string
        example: Abraham%
      - name: carts.eq
        in: query
        description: Determines whether to filter by cart transactions
        schema:
          type: boolean
      - in: query
        name: limit
        description: The maximum number of records that will be returned in a result set.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 10
        example: 50
      - in: query
        name: offset
        description: The number of records to skip before starting to collect the result set. Used in conjunction with limit query parameter for pagination support
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        example: 20
