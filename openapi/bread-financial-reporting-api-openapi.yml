  /api/reporting/report/targeting-export:
    get:
      tags:
      - Reporting
      summary: List targeting export CSV
      description: List targeting export in a paginated csv format based on provided filters
      operationId: listTargetingExportCSV
      security:
      - bearerAuthReporting:
        - r:application
        - r:tx
      parameters:
      - name: merchantID.eq
        in: query
        required: true
        description: Query items belonging to provided merchant identifier.
        schema:
          type: string
          format: uuid
          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
          externalDocs:
            description: RFC4122
            url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: programID.eq
        in: query
        description: Query items belonging to provided identifier(s) of the program(s).
        explode: true
        schema:
          type: array
          minItems: 0
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: startDate.gte
        in: query
        required: true
        description: 'Query items from the provided date (included). '
        schema:
          type: string
          format: date
          description: The date value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: endDate.lte
        in: query
        required: true
        description: Query items to the provided date (included).
        schema:
          type: string
          format: date
          description: The date value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: groupID.eq
        in: query
        description: The unique identifier(s) of the group(s) which is used to fetch transactions made from the locations belonging to these groups.
        style: form
        explode: true
        schema:
          type: array
          minItems: 0
          maxItems: 1
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: locationID.eq
        in: query
        description: The unique identifier(s) of the location(s) which is used to fetch transactions made from these locations.
        style: form
        explode: true
        schema:
          type: array
          minItems: 0
          maxItems: 1
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: includeAllDescendantMerchants
        in: query
        description: Boolean parameter to include all descendant merchants in the report
        schema:
          type: boolean
        example: 'true'
      - in: query
        name: limit
        description: The maximum number of records that will be returned in a result set.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 10
        example: 50
      - in: query
        name: offset
        description: The number of records to skip before starting to collect the result set. Used in conjunction with limit query parameter for pagination support
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        example: 20
      responses:
        '200':
          description: List targeting export response.
          content:
            application/json:
              schema:
                type: object
                description: all metadata and data related to a targeting export report
                properties:
                  profile:
                    type: string
                    description: declares the descriptor of the resource
                    example: tabular-data-resource
                  name:
                    type: string
                    description: simple identifier to be used for the resource
                    example: targeting-export
                  title:
                    type: string
                    description: human readable title or label for the resource
                    example: Targeting Export
                  description:
                    type: string
                    description: human readable description of the resource
                    example: Targeting Export contains application data based on various parameters
                  mediatype:
                    type: string
                    description: expected report response media type
                    example: text/csv
                  data:
                    type: object
                    description: all metadata and data related to a requested report
                    properties:
                      items:
                        type: array
                        description: targeting export csv field
                        items:
                          type: array
                          items:
                            type: string
                      pagination:
                        description: Result pagination values
                        type: object
                        properties:
                          limit:
                            type: integer
                            description: The maximum number of records that will be returned.
                            example: 10
                          offset:
                            type: integer
                            description: The number of records skipped.
                            example: 0
                          total:
                            type: integer
                            description: The total available records.
                            example: 200
                  schema:
                    type: object
                    description: dictates the Header row of a CSV response
                    properties:
                      fields:
                        type: array
                        items:
                          type: object
                          description: describes a field of data returned
                          required:
                          - name
                          properties:
                            name:
                              type: string
                              description: unique value corresponing to the name of field/column present in the data
                              example: date
                            type:
                              type: string
                              description: data type of the corresponding value in the data
                              example: datetime
                example:
                  profile: tabular-data-resource
                  name: targeting-export
                  title: Targeting Export
                  description: Targeting Export contains application data based on various parameters
                  mediatype: text/csv
                  data:
                    items:
                    - - application_updated_date
                      - name
                      - email
                      - access_to_bread_financing
                      - currency
                      - cart_total
                      - checkout_status
                      - phone_number
                      - state
                      - capacity
                      - items
                    - - <application_updated_date value 1>
                      - <name value 1>
                      - '...'
                    - - <application_updated_date value 2>
                      - <name value 2>
                      - '...'
                    pagination:
                      total: 0
                      limit: 0
                      offset: 0
