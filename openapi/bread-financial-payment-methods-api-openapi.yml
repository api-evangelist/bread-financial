                        externalDocs:
                          description: RFC3339
                          url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
                      description: The timestamp of when this manual payment was collected.
                externalCollection:
                  type: object
                  description: A request to create an external collection payment method.  Will be used as part of the CreatePaymentMethodRequest.
                  properties:
                    originalAccountNumber:
                      type: string
                      description: This is the original account number associated to the external collection.
                    fundingAccountType:
                      type: string
                      description: This is type associated to the funding account.
                    externalAgency:
                      type: string
                      description: This is the name of the external collection agency.
                tradeInCredit:
                  type: object
                  description: A request to create a trade in credit.  Will be used as part of the CreatePaymentMethodRequest.
                  properties:
