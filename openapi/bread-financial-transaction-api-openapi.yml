    post:
      tags:
      - Transaction
      summary: Search Transactions By Keyword
      description: Search transactions based on a keyword in a paginated format
      operationId: searchTransactionsByKeyword
      security:
      - bearerAuthTransaction:
        - r:tx
      parameters:
      - name: merchantID.eq
        in: query
        description: The unique identifier of the merchant.
        schema:
          type: string
          format: uuid
          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
          externalDocs:
            description: RFC4122
            url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: programID.eq
        in: query
        description: The unique identifier(s) of the program(s).
        style: form
        explode: true
        schema:
          type: array
          minItems: 0
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: query
        in: query
        description: Keyword to query transactions based on. This can be a transaction ID, external reference ID, or billing contact name.
        schema:
          type: string
        example: Abraham
      - in: query
        name: limit
        description: The maximum number of records that will be returned in a result set.
        required: false
        schema:
          type: integer
