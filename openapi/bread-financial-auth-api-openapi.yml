  /api/auth/buyer/authorize:
    post:
      tags:
      - Auth
      summary: Authorize a buyer based on buyer credentials
      description: 'This endpoint verifies an SMS or email code for new and returning buyers. It will return either an anonymous or buyer JWT.


        A buyer is looked up using the phone/email provided in the request to `POST /api/auth/send-code`. If a buyer successfully found, that buyer is logged in, and a buyer JWT is returned. If the buyer is not found, an anonymous JWT is returned to the user which can be used to create a new buyer. There are a few notable exceptions for which an anonymous JWT may be returned even if the buyer is found


        1. If the buyer is found, the phone/email provided in the request to `POST /api/auth/send-code` is matched against what''s on the buyer. If there is a mismatch, and the buyer has not yet provided tenant-specific PII information (name/IIN/DOB), an anonymous JWT will be returned.


        2. If the email provided in the request to `POST /api/auth/send-code` does not match what is found on the buyer, and the PII information provided as credentials to this endpoint also don''t match what is found on the buyer, an anonymous JWT will be returned.'
      operationId: buyerAuthorize
      parameters:
      - name: X-Bread-APP-ID
        description: The header containing a valid appID.
        in: header
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              required:
              - referenceID
              - credentials
              type: object
              properties:
                credentials:
                  type: object
                  properties:
                    code:
                      description: The OTP code.
                      type: string
                      example: '1234'
                    firstName:
                      description: A buyer's first name.
                      type: string
                    lastName:
                      description: A buyer's last name.
                      type: string
                    iin:
                      description: The buyer's IIN or last 4 digits of IIN.
                      type: string
                      example: '123456789'
                    dob:
                      type: string
                      format: date
                      description: The date value formatted per RFC3339. This does not allow nulls.
                      example: '2020-12-31'
                      externalDocs:
                        description: RFC3339
                        url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
                  required:
                  - code
                referenceID:
                  type: string
                  description: A reference ID from a successful request to `POST /api/auth/send-code`.
                  format: uuid
                merchantID:
                  format: uuid
                  description: An identifier used to define a merchant.
                  type: string
                programID:
                  description: An identifier used to define a program.
                  type: string
                  format: uuid
                buyerID:
                  description: An identifier used to define a buyer. If provided, Auth will attempt to fetch a buyer from Buyer service by ID instead of phone or email.
                  type: string
                  format: uuid
      responses:
        '200':
          description: A response from a successful request to `POST /api/auth/buyer/authorize`.
          headers:
            Authorization:
              schema:
                type: string
              description: The generated JWT.
          content:
            application/json:
              schema:
                description: A response containing a JWT successfully returned from the `POST /api/auth/buyer/authorize` endpoint
                type: object
                allOf:
                - type: object
                  description: Default error model for Auth errors
                  required:
                  - token
                  - tokenExpiresAt
                  properties:
                    token:
                      description: A JWT.
                      type: string
                    tokenExpiresAt:
                      type: string
                      format: date-time
                      description: The timestamp value formatted per RFC3339. This does not allow nulls.
                      example: '2020-12-31T15:10:55Z'
                      externalDocs:
                        description: RFC3339
                        url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
                    tokenType:
                      description: The type of the token.
                      type: string
                      example: Bearer
                properties:
                  buyerID:
                    description: An identifier used to define a buyer. This value will not be present for new (anonymous) buyers.
                    type: string
                    format: uuid
              examples:
                anonymous:
                  summary: Anonymous JWT response
                  value:
                    token: '{Anonymous JWT}'
                    tokenExpiresAt: '2021-09-08T16:43:44.366359272Z'
                    buyerID: ''
                buyer:
                  summary: Buyer JWT response
                  value:
                    token: '{Buyer JWT}'
                    tokenExpiresAt: '2021-09-08T16:44:54.132037516Z'
                    buyerID: d83d5bfa-44db-44c0-b12d-fc3883f95d5e
