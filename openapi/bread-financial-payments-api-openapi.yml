  /api/payments/payment/cancel:
    put:
      summary: Cancel a payment
      description: Cancel a payment by referenceID and returns the updated payment.
      operationId: cancelPayment
      responses:
        '200':
          description: A successful response returns a payment model with cancelled status.
          content:
            application/json:
              schema:
                type: object
                description: A response object for a cancel payment request.
                required:
                - payment
                properties:
                  payment:
                    type: object
                    description: An object that represents a payment model.
                    properties:
                      id:
                        allOf:
                        - type: string
                          format: uuid
                          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
                          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
                          externalDocs:
                            description: RFC4122
                            url: https://datatracker.ietf.org/doc/html/rfc4122.html
                        description: A unique payment identifier.
                      ownerEntityID:
                        allOf:
                        - type: string
                          format: uuid
                          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
                          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
                          externalDocs:
                            description: RFC4122
                            url: https://datatracker.ietf.org/doc/html/rfc4122.html
                        description: A unique owner entity identifier.
                      paymentMethodID:
                        allOf:
                        - type: string
                          format: uuid
                          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
                          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
                          externalDocs:
                            description: RFC4122
                            url: https://datatracker.ietf.org/doc/html/rfc4122.html
                        description: A unique payment method identifier.
                      programID:
                        allOf:
                        - type: string
                          format: uuid
                          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
                          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
                          externalDocs:
                            description: RFC4122
                            url: https://datatracker.ietf.org/doc/html/rfc4122.html
                        description: A unique program identifier.
                      referenceID:
                        allOf:
                        - type: string
                          format: uuid
                          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
                          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
                          externalDocs:
                            description: RFC4122
                            url: https://datatracker.ietf.org/doc/html/rfc4122.html
                        description: A unique payment reference identifier.
                      sourceID:
