  /api/cart/{id}:
    get:
      tags:
      - Cart
      description: Returns the stored Cart information associated with a Cart ID. Will return the Cart information even if the Cart is expired
      summary: Get Cart
      operationId: getCartByID
      security:
      - bearerAuthCarts:
        - r:cart
      parameters:
      - name: id
        in: path
        description: Unique Cart ID that is associated with a Cart.
        required: true
        schema:
          type: string
          format: uuid
          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
          externalDocs:
            description: RFC4122
            url: https://datatracker.ietf.org/doc/html/rfc4122.html
      responses:
        '200':
          description: Returns a Cart object
          content:
            application/json:
              schema:
                description: Cart object
                properties:
                  id:
                    type: string
                    format: string
                    description: CartID associated with a Cart
                    example: 965316f5-e7a7-41d1-b89f-db8463caf471
                  checkoutCompleteUrl:
                    type: string
                    format: uri
                    description: URL that the customer is redirected to following a successful checkout
                    example: https://merchant.com/checkout-complete
                  callbackUrl:
                    type: string
                    format: uri
                    description: Where we'll POST the transactionID of the checkout and the orderRef following a successful checkout.
                    example: https://www.breadfinancial.com/
