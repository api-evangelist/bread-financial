  /api/transaction:
    get:
      tags:
      - Transaction
      summary: List Transactions
      description: List transactions in a paginated format based on provided filters
      operationId: listTransactions
      security:
      - bearerAuthTransaction:
        - r:tx
      parameters:
      - name: merchantID.eq
        in: query
        description: The unique identifier of the merchant.
        schema:
          type: string
          format: uuid
          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
          externalDocs:
            description: RFC4122
            url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: programID.eq
        in: query
        description: The unique identifier(s) of the program(s).
        style: form
        explode: true
        schema:
          type: array
          minItems: 0
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: groupID.eq
        in: query
        description: The unique identifier(s) of the group(s) which is used to fetch transactions made from the locations belonging to these groups.
        style: form
        explode: true
        schema:
          type: array
          minItems: 0
          maxItems: 1
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: locationID.eq
        in: query
        description: The unique identifier(s) of the location(s) which is used to fetch transactions made from these locations.
        style: form
        explode: true
        schema:
          type: array
          minItems: 0
          maxItems: 1
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: createdAt.lt
        in: query
        description: The date and time before which all returned transactions have been created.
        schema:
          type: string
          format: date-time
          description: The timestamp value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31T15:10:55Z'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: createdAt.gte
        in: query
        description: The date and time after and including which all returned transactions have been created.
        schema:
          type: string
          format: date-time
          description: The timestamp value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31T15:10:55Z'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: expiresAt.lt
        in: query
        description: The date and time before which all returned transactions will expire.
        schema:
          type: string
          format: date-time
          description: The timestamp value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31T15:10:55Z'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: expiresAt.gte
        in: query
        description: The date and time after and including which all returned transactions will expire.
        schema:
          type: string
          format: date-time
          description: The timestamp value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31T15:10:55Z'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: status.eq
        in: query
        description: Equal to the given transaction status(es).
        explode: true
        schema:
          type: array
          minItems: 0
          items:
            description: The possible statuses of a Transaction
            type: string
            enum:
            - AUTHORIZED
            - CANCELLED
            - EXPIRED
            - PARTIALLY_AUTHORIZED
            - PARTIALLY_REFUNDED
            - PARTIALLY_SETTLED
            - PENDING
            - REFUNDED
            - SETTLED
            - CHARGEDBACK
            - PARTIALLY_CHARGEDBACK
      - name: paymentProductID.eq
        in: query
        description: Equal to the given payment product ID(s).
        explode: true
        schema:
          type: array
          minItems: 0
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - in: query
        name: limit
        description: The maximum number of records that will be returned in a result set.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 10
        example: 50
      - in: query
        name: offset
        description: The number of records to skip before starting to collect the result set. Used in conjunction with limit query parameter for pagination support
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        example: 20
      - name: sort
        in: query
        description: The sort key.
        schema:
          description: The possible sort keys for listing Transactions
          type: string
          enum:
          - createdAt.asc
          - createdAt.desc
          - billingContact.asc
          - billingContact.desc
          - status.asc
          - status.desc
          - expiresAt.asc
          - expiresAt.desc
      - name: carts.eq
        in: query
