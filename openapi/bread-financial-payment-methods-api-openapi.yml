  /api/payments/payment-method/bank-account:
    get:
      summary: List bank accounts by routing and last4
      description: Returns a list of payment methods for bank accounts matching the provided routing number and last 4 digits of the account number. The client must pass the plain routing number; the service hashes it and matches it in the database. Timestamp of creation is returned in results.
      operationId: listBankAccountsByRoutingAndLast4
      parameters:
      - name: routingnumber
        in: query
        required: true
        description: Plain routing number (will be hashed server-side).
        schema:
          type: string
          minLength: 9
          maxLength: 9
      - name: accountnumber_last4
        in: query
        required: true
        description: Last 4 digits of the bank account number.
        schema:
          type: string
          minLength: 4
          maxLength: 4
      - description: API version
        in: header
        name: X-API-VERSION
        required: true
        schema:
          type: string
        example: v2
      responses:
        '200':
          description: A successful response that returns an array of payment method models matching routing number + account last4.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: An object that represents a payment method model.  Only one of the sub models, BankAccount and CardAccount, will exist and will be identified by paymentMethodType.
                  required:
                  - id
                  - createdAt
                  - name
                  - paymentMethodType
                  - updatedAt
                  properties:
                    id:
                      allOf:
                      - type: string
                        format: uuid
                        description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
                        example: dc0dc633-1760-4d43-ba1d-da94ed701f06
                        externalDocs:
                          description: RFC4122
                          url: https://datatracker.ietf.org/doc/html/rfc4122.html
                      description: A unique payment method identifier.
                    scopeID:
                      allOf:
                      - type: string
                        format: uuid
                        description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
                        example: dc0dc633-1760-4d43-ba1d-da94ed701f06
                        externalDocs:
                          description: RFC4122
                          url: https://datatracker.ietf.org/doc/html/rfc4122.html
                      description: A unique scope identifier that should correlate to scopeType. For example, a buyer id or merchant id.
                    name:
                      type: string
                      description: A descriptive name to identify the payment method.
                      example: John Doe Bank Account
                    paymentMethodType:
                      type: string
                      enum:
                      - UNKNOWN_PAYMENT_METHOD_TYPE
                      - BANK_ACCOUNT
                      - CARD_ACCOUNT
                      - BANK_ACCOUNT_AUTHENTICATED
                      - CHECK_PAYMENT
                      - MANUAL_PAYMENT
                      - EXTERNAL_COLLECTION
                      - TRADE_IN_CREDIT
                      - PAPER_CHECK
                      default: UNKNOWN_PAYMENT_METHOD_TYPE
                      description: A high level category of the form of payments.
                      example: BANK_ACCOUNT_AUTHENTICATED
                    scopeType:
                      type: string
                      enum:
                      - UNKNOWN_SCOPE_TYPE
