        schema:
          type: array
          minItems: 0
          items:
            description: The possible statuses of a Transaction
            type: string
            enum:
            - AUTHORIZED
            - CANCELLED
            - EXPIRED
            - PARTIALLY_AUTHORIZED
            - PARTIALLY_REFUNDED
            - PARTIALLY_SETTLED
            - PENDING
            - REFUNDED
            - SETTLED
            - CHARGEDBACK
