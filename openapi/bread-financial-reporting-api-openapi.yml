  /api/reporting/report/data-insight:
    get:
      tags:
      - Reporting
      summary: Get Data Insight Report By Name
      description: Get historical reports and analytics
      operationId: getDataInsight
      security:
      - bearerAuthReporting:
        - r:reporting.analytics
      parameters:
      - name: merchantID.eq
        in: query
        required: true
        description: Query items belonging to provided merchant identifier.
        schema:
          type: string
          format: uuid
          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
          externalDocs:
            description: RFC4122
            url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: programID.eq
        in: query
        description: Query items belonging to provided identifier(s) of the program(s).
        explode: true
        schema:
          type: array
          minItems: 0
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: date.gte
        in: query
        required: true
        description: Query items with dates on and after provided date.
        schema:
          type: string
          format: date
          description: The date value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: date.lte
        in: query
        required: true
        description: Query items with dates before and on provided date.
        schema:
          type: string
          format: date
          description: The date value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: groupID.eq
        in: query
        description: The unique identifier(s) of the group(s) which is used to fetch transactions made from the locations belonging to these groups.
        style: form
        explode: true
        schema:
          type: array
          minItems: 0
          maxItems: 1
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: locationID.eq
        in: query
        description: The unique identifier(s) of the location(s) which is used to fetch transactions made from these locations.
        style: form
        explode: true
        schema:
          type: array
          minItems: 0
          maxItems: 1
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: includeAllDescendantMerchants
        in: query
        description: Boolean parameter to include all descendant merchants in the report
        schema:
          type: boolean
        example: 'true'
      - name: aggregateBy.eq
        in: query
        description: Unique string parameter to decide date range unit to be aggregated for the report.
        schema:
          type: string
          enum:
          - daily
          - weekly
          - monthly
          - yearly
        required: false
        example: monthly
      - name: responseType.eq
        in: query
        description: Unique string parameter to decide the response type to be whether in json or csv. This is optional, and the response is default to json.
        schema:
          type: string
          enum:
          - json
          - csv
        required: false
        example: json
      responses:
        '200':
          description: Get data insight report response.
          content:
            application/json:
              schema:
                type: object
                description: all metadata and data related to a requested report
                required:
                - name
                - data
                properties:
                  profile:
                    type: string
                    description: declares the descriptor of the resource
                    example: tabular-data-resource
                  name:
                    type: string
                    description: simple identifier to be used for the resource
                    example: data-insight
                  title:
                    type: string
                    description: human readable title or label for the resource
                    example: Data Insight
                  description:
                    type: string
                    description: human readable description of the resource
                    example: Data Insight contains transaction metadata aggregated by day
                  mediatype:
                    type: string
                    description: expected report response mediatype
                    example: application/json
                  data:
                    oneOf:
                    - type: object
                      description: Data insight for a given merchantID and date range
                      properties:
                        totalLoanValue:
                          type: object
                          description: the total value of all loans
                          properties:
                            amount:
                              required:
                              - currency
                              - value
