  /api/transaction/search:
    get:
      tags:
      - Transaction
      summary: Search Transactions
      description: Search transactions in a paginated format based on provided filters
      operationId: searchTransactions
      deprecated: true
      security:
      - bearerAuthTransaction:
        - r:tx
      parameters:
      - name: merchantID.eq
        in: query
        description: The unique identifier of the merchant.
        schema:
          type: string
          format: uuid
          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
          externalDocs:
            description: RFC4122
            url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: programID.eq
        in: query
        description: The unique identifier(s) of the program(s).
        style: form
        explode: true
        schema:
          type: array
          minItems: 0
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: groupID.eq
        in: query
        description: The unique identifier(s) of the group(s) which is used to fetch transactions made from the locations belonging to these groups.
        style: form
        explode: true
        schema:
          type: array
          minItems: 0
          maxItems: 1
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: locationID.eq
        in: query
        description: The unique identifier(s) of the location(s) which is used to fetch transactions made from these locations.
        style: form
        explode: true
        schema:
          type: array
          minItems: 0
          maxItems: 1
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: createdAt.lt
        in: query
        description: The date and time before which all returned transactions have been created.
        schema:
          type: string
          format: date-time
          description: The timestamp value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31T15:10:55Z'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: createdAt.gte
        in: query
        description: The date and time after and including which all returned transactions have been created.
        schema:
          type: string
          format: date-time
          description: The timestamp value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31T15:10:55Z'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: expiresAt.lt
        in: query
        description: The date and time before which all returned transactions will expire.
        schema:
          type: string
          format: date-time
          description: The timestamp value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31T15:10:55Z'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: expiresAt.gte
        in: query
        description: The date and time after and including which all returned transactions will expire.
        schema:
          type: string
          format: date-time
          description: The timestamp value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31T15:10:55Z'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: status.eq
        in: query
