                      enum:
                      - RESOURCE_NOT_FOUND
                      - RETRIEVAL_ERROR
                      - WRITE_ERROR
                      - SERVICE_ERROR
                      - VALIDATION_FAILURE
                      - INVARIANT_VIOLATED
                      - SYSTEM_ERROR
                      - POLICY_ERROR
