      parameters:
      - name: scopeID.eq
        in: query
        required: false
        description: A unique scope identifier that should correlate to scopeType. For example, a buyer id or merchant id.
        schema:
          type: string
          format: uuid
          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
          externalDocs:
            description: RFC4122
            url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: scopeType.eq
        in: query
        required: false
        schema:
          type: string
          enum:
          - UNKNOWN_SCOPE_TYPE
          - BUYER
          - MERCHANT
          - PROGRAM_AGREEMENT
          - PARTNER
          default: UNKNOWN_SCOPE_TYPE
          description: Identifies the owner of the payment method.
          example: BUYER
      - name: showArchived
        in: query
        required: false
        description: Include archived payment methods.
        schema:
          type: boolean
      - name: exclude_expired
        in: query
        required: false
        description: Exclude expired payment methods.
        schema:
          type: boolean
      - name: includeAllPaymentMethodTypes
        in: query
        required: false
        description: Include payment methods not visible by default (e.g. check payments, trade in credits, manual payments, external collections).
        schema:
          type: boolean
      - name: include_blocked
        in: query
        required: false
        description: Include blocked Bank Accounts. If not passed, payments will exclude blocked bank accounts
        schema:
          type: boolean
      - description: API version
        in: header
        name: X-API-VERSION
        required: true
        schema:
          type: string
        example: v2
      tags:
      - Payment Methods
      security:
      - bearerAuthPayments:
        - r:paymentMethod.restricted
  /api/payments/payment-method/{paymentMethodID}:
    get:
      summary: Get Payment Method
      description: Returns a payment method matching the provided id.
      operationId: getPaymentMethod
      responses:
        '200':
          description: A successful response returns a payment method model.
          content:
            application/json:
              schema:
                type: object
                description: A response object for a payment method get request.
                properties:
                  paymentMethod:
                    type: object
                    description: An object that represents a payment method model.  Only one of the sub models, BankAccount and CardAccount, will exist and will be identified by paymentMethodType.
                    required:
                    - id
                    - createdAt
                    - name
                    - paymentMethodType
                    - updatedAt
                    properties:
                      id:
                        allOf:
                        - type: string
                          format: uuid
                          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
                          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
                          externalDocs:
                            description: RFC4122
                            url: https://datatracker.ietf.org/doc/html/rfc4122.html
                        description: A unique payment method identifier.
                      scopeID:
                        allOf:
                        - type: string
                          format: uuid
                          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
                          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
                          externalDocs:
                            description: RFC4122
                            url: https://datatracker.ietf.org/doc/html/rfc4122.html
                        description: A unique scope identifier that should correlate to scopeType. For example, a buyer id or merchant id.
                      name:
                        type: string
                        description: A descriptive name to identify the payment method.
                        example: John Doe Bank Account
                      paymentMethodType:
                        type: string
                        enum:
                        - UNKNOWN_PAYMENT_METHOD_TYPE
                        - BANK_ACCOUNT
                        - CARD_ACCOUNT
                        - BANK_ACCOUNT_AUTHENTICATED
                        - CHECK_PAYMENT
                        - MANUAL_PAYMENT
                        - EXTERNAL_COLLECTION
                        - TRADE_IN_CREDIT
                        - PAPER_CHECK
                        default: UNKNOWN_PAYMENT_METHOD_TYPE
                        description: A high level category of the form of payments.
                        example: BANK_ACCOUNT_AUTHENTICATED
                      scopeType:
                        type: string
                        enum:
                        - UNKNOWN_SCOPE_TYPE
                        - BUYER
                        - MERCHANT
                        - PROGRAM_AGREEMENT
                        - PARTNER
                        default: UNKNOWN_SCOPE_TYPE
                        description: Identifies the owner of the payment method.
                        example: BUYER
                      createdAt:
                        allOf:
                        - type: string
                          format: date-time
                          description: The timestamp value formatted per RFC3339. This does not allow nulls.
                          example: '2020-12-31T15:10:55Z'
                          externalDocs:
                            description: RFC3339
                            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
                        description: The timestamp that this payment method was created at.
                      deletedAt:
                        allOf:
                        - type: string
                          format: date-time
                          description: The timestamp value formatted per RFC3339. This does not allow nulls.
                          example: '2020-12-31T15:10:55Z'
                          externalDocs:
                            description: RFC3339
                            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
                        description: The timestamp this payment method was deleted at.
                      updatedAt:
                        allOf:
                        - type: string
                          format: date-time
                          description: The timestamp value formatted per RFC3339. This does not allow nulls.
                          example: '2020-12-31T15:10:55Z'
                          externalDocs:
                            description: RFC3339
                            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
                        description: The timestamp this payment method was last updated at.
                      isDeletable:
                        type: boolean
                        description: A flag indicating if a payment method can be deleted.
                        example: true
                      bankAccount:
                        type: object
                        description: Details about a bank account payment method.
                        required:
