                        description: 'Provisioning status of the issuance.

                          `REQUESTED` represents a requested but not yet issued card.

                          `PROCESSING` represents a provisioning issuance.

                          `ISSUED` represents a provisioned issuance.

                          `FAILED` represents an issuance that failed to provision.

                          `CLOSED` represents an issuance that has gone through checkout and can no longer be modified.'
