  /api/transaction/kpi:
    get:
      tags:
      - Transaction
      summary: Transaction KPIs
      description: Get the transaction KPIs based on the parameters
      operationId: kpi
      security:
      - bearerAuthTransaction:
        - r:tx
      parameters:
      - name: merchantID.eq
        in: query
        required: true
        description: The unique identifier of the merchant.
        schema:
          type: string
          format: uuid
          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
          externalDocs:
            description: RFC4122
            url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: programID.eq
        in: query
        description: The unique identifier(s) of the program(s).
        style: form
        explode: true
        schema:
          type: array
          minItems: 0
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: createdAt.gte
        in: query
        description: The date and time after and including which all returned transactions have been created.
        schema:
          type: string
          format: date-time
          description: The timestamp value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31T15:10:55Z'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: createdAt.lt
        in: query
        description: The date and time before which all returned transactions have been created.
        schema:
          type: string
          format: date-time
          description: The timestamp value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31T15:10:55Z'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      responses:
        '200':
          description: An array of key performance indicators
          content:
            application/json:
              schema:
                description: An array of key performance indicators
                type: object
                required:
                - kpi
                properties:
                  kpi:
                    type: array
                    items:
                      description: A key performance indicator for a particular transaction status. This is an aggregation across many transactions.
                      required:
                      - status
                      - adjustedAmount
                      - refundedAmount
                      - chargedbackAmount
                      - cancelledAmount
                      - settledAmount
                      - totalAmount
                      properties:
                        status:
                          description: The possible statuses of a Transaction
                          type: string
                          enum:
                          - AUTHORIZED
                          - CANCELLED
                          - EXPIRED
                          - PARTIALLY_AUTHORIZED
                          - PARTIALLY_REFUNDED
                          - PARTIALLY_SETTLED
                          - PENDING
                          - REFUNDED
                          - SETTLED
                          - CHARGEDBACK
                          - PARTIALLY_CHARGEDBACK
                        adjustedAmount:
                          description: Sum of the amount after adjustments.
                          allOf:
                          - required:
                            - currency
                            - value
                            properties:
