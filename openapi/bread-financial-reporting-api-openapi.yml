  /api/reporting/report/funding-aggregate-summary:
    get:
      tags:
      - Reporting
      summary: List funding aggregate balance data
      operationId: listFundingAggregateSummaryJSON
      security:
      - bearerAuthReporting:
        - r:funding.funding_summary
      parameters:
      - name: merchantID.eq
        in: query
        required: true
        description: Query items belonging to provided merchant identifier.
        schema:
          type: string
          format: uuid
          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
          externalDocs:
            description: RFC4122
            url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: programID.eq
        in: query
        description: Query items belonging to provided identifier(s) of the program(s).
        explode: true
        schema:
          type: array
          minItems: 0
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: effectiveDate.gt
        in: query
        description: Query items with effective dates after provided date.
        schema:
          type: string
          format: date
          description: The date value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: effectiveDate.gte
        in: query
        description: Query items with effective dates on and after provided date.
        schema:
          type: string
          format: date
          description: The date value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: effectiveDate.lt
        in: query
        description: Query items with effective dates before provided date.
        schema:
          type: string
          format: date
          description: The date value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: effectiveDate.lte
        in: query
        description: Query items with effective dates before and on provided date.
        schema:
          type: string
          format: date
          description: The date value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      responses:
        '200':
          description: The funding aggregate summary response
          content:
            application/json:
              schema:
                description: A summary of the funding data
                type: object
                properties:
                  profile:
                    type: string
                    description: declares the descriptor of the resource
                    example: tabular-data-resource
                  name:
                    type: string
                    description: simple identifier to be used for the resource
                    example: funding-aggregate-summary
                  title:
                    type: string
                    description: human readable title or label for the resource
                    example: Funding Summary Report
                  description:
                    type: string
                    description: human readable description of the resource
                    example: Funding summary report contains application data based on various parameters
                  mediatype:
                    type: string
                    description: expected report response media type
                    example: application/json
                  data:
                    type: object
                    description: all metadata and data related to a requested report
                    properties:
                      fundingEventCount:
                        description: The number of funding event data included in this summary
                        type: integer
                      totalSettledAmount:
                        description: The total amount settled
                        allOf:
                        - required:
                          - currency
                          - value
                          properties:
                            currency:
                              type: string
                              description: The three letter currency code as defined in ISO 4217.
                              example: USD
                              minLength: 3
                              maxLength: 3
                              externalDocs:
                                description: ISO 4217
                                url: https://en.wikipedia.org/wiki/ISO_4217
