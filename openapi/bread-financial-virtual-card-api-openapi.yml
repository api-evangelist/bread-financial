                      buyerID:
                        description: Buyer ID for the issuance.
                        type: string
                        format: uuid
                        example: d8a265ce-5d9c-4d0b-9edd-401450f78e09
                      programID:
                        description: Program ID for the issuance.
                        type: string
                        format: uuid
                        example: d8a265ce-5d9c-4d0b-9edd-401450f78e09
                      tenantID:
                        description: Tenant ID for the issuance.
