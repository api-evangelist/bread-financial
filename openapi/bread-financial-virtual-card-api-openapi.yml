                        required:
                        - applicationID
                        properties:
                          applicationID:
                            description: ID of the application associated with this in-store issuance.
                            type: string
                            format: uuid
                            example: d8a265ce-5d9c-4d0b-9edd-401450f78e09
                          merchantID:
                            description: ID of the merchant associated with this in-store issuance.
                            type: string
                            format: uuid
                            example: d8a265ce-5d9c-4d0b-9edd-401450f78e09
                          merchantLocationID:
