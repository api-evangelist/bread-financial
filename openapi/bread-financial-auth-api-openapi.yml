  /api/auth/code/{referenceID}/status:
    get:
      tags:
      - Auth
      summary: Get the status of a Verification OTP Code
      description: Returns the status of a code sent via a send-code request.
      operationId: getStatusByCodeID
      parameters:
      - name: X-Bread-APP-ID
        description: The header containing a valid appID.
        in: header
        schema:
          type: string
        required: true
      - name: referenceID
        in: path
        required: true
        description: The unique identifier of a otp code.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The status of the code with the ID found in URL of the GET request.
          content:
            application/json:
              schema:
                type: object
                description: A response containing the status of the code with the ID from the `GET /api/auth/code/{referenceID}/status` endpoint
                required:
                - status
                properties:
                  status:
                    description: A status of an OTP code.
                    type: string
        '400':
          description: Response for Auth errors
          content:
            application/json:
              schema:
                type: object
                description: Default error model for Auth errors
                allOf:
                - required:
                  - code
                  - domain
                  - message
                  type: object
                  properties:
                    code:
