                                externalDocs:
                                  description: ISO-3166-1
                                  url: https://en.wikipedia.org/wiki/ISO_3166-1
                              description: The country code for this bank account's location.
                            currency:
                              allOf:
                              - type: string
                                description: The three letter currency code as defined in ISO 4217.
