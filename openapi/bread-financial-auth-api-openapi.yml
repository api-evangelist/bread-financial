  /api/auth/code:
    get:
      security:
      - bearerAuth:
        - r:otp
      description: 'Allows a user to list OTP codes using filtering query parameters.


        A user can search by phone, email, buyerID, and/or tenantID. If present on the JWT, the buyerID/tenantID claims are automatically added to the search parameters. To filter by verified OTP codes, add `&verifiedCodeOnly` to query.


        For a valid request, at least one of the `buyerID.eq`, `phone.eq` or `email.eq` filters is required.'
      tags:
      - Auth
      summary: List codes
      operationId: listCodes
      parameters:
      - description: Searches exact matches on buyerID. Must be URI encoded.
        name: buyerID.eq
        in: query
        required: false
        schema:
          type: string
        example: 15f26406-09db-49bb-a715-0a41c20cbef1
      - description: Searches exact matches on phone. Must be URI encoded.
        name: phone.eq
        in: query
        required: false
        schema:
          type: string
        example: '+19667079543'
      - description: Searches exact matches on email. Must be URI encoded.
        name: email.eq
        in: query
        required: false
        schema:
          type: string
        example: automation%2b8c340e1ff6e6935ce638@breadpayments.com
      - description: Filters the response to only include a record in the response if the code is verified.
        name: verifiedCodeOnly
        in: query
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      - in: query
        name: limit
        description: The maximum number of records that will be returned in a result set.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 10
        example: 50
      - in: query
        name: offset
        description: The number of records to skip before starting to collect the result set. Used in conjunction with limit query parameter for pagination support
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        example: 20
      responses:
        '200':
          description: A list of buyers that match the filtering criteria.
          content:
            application/json:
              schema:
                description: A list of Code records including pagination response fields.
                type: object
                properties:
                  codes:
                    type: array
                    items:
                      description: Code represents an OTP code record
                      type: object
                      properties:
                        id:
                          description: Unique ID associated with this code.
                          type: string
                          format: uuid
                          example: c3f8e97b-2d09-4cb8-a41e-c5b635b0f1e3
                          readOnly: true
                        tenantID:
                          description: The tenantID associated with the X-Bread-APP-ID header passed to /api/send-code.
                          type: string
                          format: uuid
                          example: c3f8e97b-2d09-4cb8-a41e-c5b635b0f1e3
                          readOnly: true
                        buyerID:
                          description: The ID of the buyer who verified this OTP code using phone or email.
                          type: string
                          format: uuid
                          example: c3f8e97b-2d09-4cb8-a41e-c5b635b0f1e3
                        ip:
                          description: The IP of the buyer who verified this OTP code.
                          type: string
                          format: ipv4
                          example: 127.0.0.1
                        loginPIIMismatch:
                          description: A nullable boolean represented whether or not a PII mismatch occured during login.
                          type: boolean
                          readOnly: true
                        phone:
                          description: The phone number provided to /api/send-code.
                          allOf:
                          - type: string
                            description: Telephone number including country code
                            example: '+14539842345'
                        email:
                          description: The email address provided to /api/send-code.
                          allOf:
                          - type: string
                            format: email
                            description: Email address
                            example: john.doe@gmail.com
                        deliveryMethod:
                          type: string
                          description: List of types of delivery methods.
                          enum:
                          - SMS
                          - EMAIL
                        createdAt:
                          description: The time at which this code was created.
                          allOf:
                          - type: string
                            format: date-time
                            description: The timestamp value formatted per RFC3339. This does not allow nulls.
                            example: '2020-12-31T15:10:55Z'
                            externalDocs:
                              description: RFC3339
                              url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
                        verifiedAt:
                          description: The time at which this code was verified. Codes with the verifiedAt timestamp set should also have buyerID set to a non-nil UUID
                          allOf:
                          - type: string
                            format: date-time
                            description: The timestamp value formatted per RFC3339. This does not allow nulls.
                            example: '2020-12-31T15:10:55Z'
                            externalDocs:
                              description: RFC3339
                              url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
                        disclosures:
                          description: The list of disclosures to which the buyer provides consent.
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                description: A required disclosure.
                                type: string
                              acceptedAt:
                                type: string
                                format: date-time
                                description: The timestamp value formatted per RFC3339. This does not allow nulls.
                                example: '2020-12-31T15:10:55Z'
                                externalDocs:
                                  description: RFC3339
                                  url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
                        isDelivered:
                          description: A nullable boolean represented whether or not a code was successfully delivered through SMS via Telesign. For EMAIL delivery, it will always be NULL, because Auth cannot confirm receipt of Kafka messages.
                          type: boolean
                          readOnly: true
                        deliveryError:
                          description: If isDelivered is true, this field will contain the error returned by Telesign.
                          type: string
                          readOnly: true
                  limit:
                    description: The limit value used.
                    type: integer
                    example: 10
                  offset:
                    description: The offset value used.
                    type: integer
                    example: 0
                  total:
                    description: The total count of OTP code records found in the database, if any.
                    type: integer
                    example: 1000
