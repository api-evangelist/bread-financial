                          properties:
                            currency:
                              type: string
                              description: The three letter currency code as defined in ISO 4217.
                              example: USD
                              minLength: 3
                              maxLength: 3
                              externalDocs:
                                description: ISO 4217
                                url: https://en.wikipedia.org/wiki/ISO_4217
                            value:
                              type: integer
                              description: 'Monetary value as an integral number of the currency fractional unit e.g for USD: cents'
                              format: int64
                              example: 100
                          description: Represents a monetary amount in the specified currency
                          example:
                            currency: USD
                            value: 50000
                      example:
                        transaction_id: d8a265ce-5d9c-4d0b-9edd-401450f78e09
                        amount:
                          currency: USD
                          value: 12345
                        date: '2022-07-21'
                        city: Minneapolis
                        state: MN
                        postal_code: '55401'
                        name: Some Merchant
                        type: AUTHORIZATION
                        running_total:
                          currency: USD
                          value: 12345
