  /api/transaction/{transactionID}/history:
    get:
      tags:
      - Transaction
      summary: Get Transaction History
      description: Returns the history of actions that have been performed for a single transaction, sorted by creation datetime in descending order.
      operationId: getTransactionHistory
      security:
      - bearerAuthTransaction:
        - r:tx
      parameters:
      - name: transactionID
        in: path
        description: The ID of the transaction to perform the action on
        required: true
        schema:
          type: string
          format: uuid
          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
          externalDocs:
            description: RFC4122
            url: https://datatracker.ietf.org/doc/html/rfc4122.html
      responses:
        '200':
          description: An array containing all of the actions performed for a single transaction, sorted by the creation datetime in descending order.
          content:
            application/json:
              schema:
                description: An array containing the points of history in a single transaction.
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      description: An action that was performed on a transaction.
                      required:
                      - id
                      - amount
                      - merchantOfRecordID
                      - transactionID
                      - type
                      - vcc
                      - createdAt
                      - createdBy
                      properties:
                        id:
                          description: The unique ID of this transaction history.
                          allOf:
                          - type: string
                            format: uuid
                            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
                            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
                            externalDocs:
                              description: RFC4122
                              url: https://datatracker.ietf.org/doc/html/rfc4122.html
                        amount:
                          required:
                          - currency
                          - value
                          properties:
                            currency:
                              type: string
                              description: The three letter currency code as defined in ISO 4217.
                              example: USD
                              minLength: 3
                              maxLength: 3
                              externalDocs:
                                description: ISO 4217
                                url: https://en.wikipedia.org/wiki/ISO_4217
                            value:
                              type: integer
                              description: 'Monetary value as an integral number of the currency fractional unit e.g for USD: cents'
                              format: int64
                              example: 100
                          description: Represents a monetary amount in the specified currency
                          example:
                            currency: USD
                            value: 50000
                        merchantOfRecordID:
                          description: The ID of the merchant of record that produced this history.
                          allOf:
                          - type: string
                            format: uuid
                            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
                            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
                            externalDocs:
                              description: RFC4122
                              url: https://datatracker.ietf.org/doc/html/rfc4122.html
                        transactionID:
                          description: The ID of the associated transaction.
                          allOf:
                          - type: string
                            format: uuid
                            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
                            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
                            externalDocs:
                              description: RFC4122
                              url: https://datatracker.ietf.org/doc/html/rfc4122.html
                        type:
                          description: The type of action that occurred.
                          allOf:
                          - description: The type of action that was performed for a given part of a transaction's history.
                            type: string
                            enum:
                            - CREATE
                            - AUTHORIZE
                            - CANCEL
                            - CHARGEBACK
                            - EXPIRE
                            - REFUND
                            - SETTLE
                        vcc:
                          type: boolean
                          description: Boolean representing whether or not this action was performed using a virtual credit card.
                        createdAt:
                          description: The timestamp of when this action was performed.
                          allOf:
                          - type: string
                            format: date-time
                            description: The timestamp value formatted per RFC3339. This does not allow nulls.
                            example: '2020-12-31T15:10:55Z'
                            externalDocs:
                              description: RFC3339
                              url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
                        createdBy:
                          description: The identity of the person or service which triggered this action, in the form of {role}:{sub}, where {role} and {sub} are claims from the jwt that was used.
                          type: string
                      example:
                        id: 1e26c50c-e443-4dd8-ac2a-282ff9a3e245
                        amount:
                          currency: USD
                          value: 7000
                        merchantOfRecordID: 0020fa5a-f107-4ba7-b7f0-d869ea0eed07
                        transactionID: 4f412fbd-a7ae-41bc-9461-78e8acae5bef
                        type: REFUND
                        vcc: false
                        createdAt: '2021-12-22T20:16:05Z'
                        createdBy: service:0cecfb92-9172-11eb-a8b3-0242ac130003
