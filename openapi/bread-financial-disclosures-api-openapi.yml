  /api/disclosure/document/{disclosureID}:
    get:
      summary: Get disclosure by ID
      description: Get the specific disclosure document defined by the disclosure ID
      operationId: getDisclosureByDisclosureID
      tags:
      - Disclosures
      security:
      - bearerAuthDisclosure:
        - r:disclosure.document
      parameters:
      - in: header
        name: X-API-VERSION
        description: 'X-API-VERSION: Header to specify the API version (i.e. v2)'
        schema:
          type: string
        required: true
      - name: disclosureID
        in: path
        description: The unique UUID assigned to each disclosure when it is generated
        required: true
        schema:
          type: string
          format: uuid
          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
          externalDocs:
            description: RFC4122
            url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: formatter
        in: query
        description: Specifies the format of the response. If set to 'pdf', the response will be returned as a PDF. Otherwise, will default to returning HTML/TEXT format.
        required: false
        schema:
          type: string
          example: pdf
      responses:
        '200':
          description: OK. The rendered disclosure markup.
          content:
            text/html:
