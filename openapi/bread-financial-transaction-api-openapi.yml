  /api/transaction/aggregation:
    get:
      tags:
      - Transaction
      summary: Transaction Aggregation
      description: Get an aggregation of transactions based on the parameters
      operationId: aggregation
      security:
      - bearerAuthTransaction:
        - r:tx
      parameters:
      - name: merchantID.eq
        in: query
        required: true
        description: The unique identifier of the merchant.
        schema:
          type: string
          format: uuid
          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
          externalDocs:
            description: RFC4122
            url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: programID.eq
        in: query
        description: The unique identifier(s) of the program(s).
        style: form
        explode: true
        schema:
          type: array
          minItems: 0
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: createdAt.gte
        in: query
        required: true
        description: The date and time after and including which all returned transactions have been created.
        schema:
          type: string
          format: date-time
          description: The timestamp value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31T15:10:55Z'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: createdAt.lt
        in: query
        required: true
        description: The date and time before which all returned transactions have been created.
        schema:
          type: string
          format: date-time
          description: The timestamp value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31T15:10:55Z'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: status.eq
        in: query
        description: Equal to the given transaction status(es).
        explode: true
        schema:
          type: array
          minItems: 0
          items:
            description: The possible statuses of a Transaction
            type: string
            enum:
            - AUTHORIZED
            - CANCELLED
            - EXPIRED
            - PARTIALLY_AUTHORIZED
            - PARTIALLY_REFUNDED
            - PARTIALLY_SETTLED
            - PENDING
            - REFUNDED
            - SETTLED
            - CHARGEDBACK
            - PARTIALLY_CHARGEDBACK
      - name: paymentProductID.eq
        in: query
        description: Equal to the given payment product ID(s).
        explode: true
        schema:
          type: array
          minItems: 0
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: carts.eq
        in: query
        description: Whether or not to include carts in the transactions returned
        schema:
          type: boolean
      - name: id.like
        in: query
        deprecated: true
        description: Transaction ID matching given pattern
        schema:
          type: string
        example: 123%
      - name: externalID.like
        in: query
        deprecated: true
        description: external ID matching given pattern.
        schema:
          type: string
        example: 123%
      - name: billingContact.like
        in: query
        deprecated: true
        description: Billing contact matching given pattern.
        schema:
          type: string
        example: Abraham%
      - name: terms.eq
        required: true
        in: query
        description: The term being aggregated
        schema:
          description: The possible aggregation terms
          type: string
          enum:
          - PAYMENTPRODUCT
          - STATUS
          - CARTS
      - name: groupID.eq
        in: query
        description: The unique identifier(s) of the group(s) which is used to fetch transactions made from the locations belonging to these groups.
        style: form
        explode: true
        schema:
          type: array
          minItems: 0
          maxItems: 1
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: locationID.eq
        in: query
        description: The unique identifier(s) of the location(s) which is used to fetch transactions made from these locations.
        style: form
        explode: true
        schema:
          type: array
          minItems: 0
          maxItems: 1
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: includeAllDescendantMerchants
        in: query
        description: Whether or not to include descendant merchants
        schema:
          type: boolean
      responses:
        '200':
          description: An array of aggregations
          content:
            application/json:
              schema:
                type: object
                required:
                - aggregations
                properties:
                  aggregations:
                    type: array
                    items:
                      description: An instance of an aggregated object
                      required:
                      - key
                      - count
                      properties:
                        key:
                          description: The aggregated key.
                          type: string
                        count:
                          description: The aggregated count matching the key.
                          type: integer
                      example:
                        key: PENDING
                        count: 100
