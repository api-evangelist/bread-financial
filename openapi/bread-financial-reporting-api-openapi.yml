  /api/reporting/report/funding-daily-summary:
    get:
      tags:
      - Reporting
      deprecated: true
      summary: List funding daily balance data
      description: List funding daily balance data in a paginated csv format based on provided filters. effectiveDate is required
      operationId: listFundingDailySummaryJSON
      security:
      - bearerAuthReporting:
        - r:funding.funding_summary
      parameters:
      - name: merchantID.eq
        in: query
        required: true
        description: Query items belonging to provided merchant identifier.
        schema:
          type: string
          format: uuid
          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
          externalDocs:
            description: RFC4122
            url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: programID.eq
        in: query
        description: Query items belonging to provided identifier(s) of the program(s).
        explode: true
        schema:
          type: array
          minItems: 0
          items:
            type: string
            format: uuid
            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
            externalDocs:
              description: RFC4122
              url: https://datatracker.ietf.org/doc/html/rfc4122.html
      - name: effectiveDate.gt
        in: query
        description: Query items with effective dates after provided date.
        schema:
          type: string
          format: date
          description: The date value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: effectiveDate.gte
        in: query
        description: Query items with effective dates on and after provided date.
        schema:
          type: string
          format: date
          description: The date value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: effectiveDate.lt
        in: query
        description: Query items with effective dates before provided date.
        schema:
          type: string
          format: date
          description: The date value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - name: effectiveDate.lte
        in: query
        description: Query items with effective dates before and on provided date.
        schema:
          type: string
          format: date
          description: The date value formatted per RFC3339. This does not allow nulls.
          example: '2020-12-31'
          externalDocs:
            description: RFC3339
            url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
      - in: query
        name: limit
        description: The maximum number of records that will be returned in a result set.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 10
        example: 50
      - in: query
        name: offset
        description: The number of records to skip before starting to collect the result set. Used in conjunction with limit query parameter for pagination support
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        example: 20
      responses:
        '200':
          description: List funding daily summary response
          content:
            application/json:
              schema:
                type: object
                description: A summary of daily funding data
                properties:
                  profile:
                    type: string
                    description: declares the descriptor of the resource
                    example: tabular-data-resource
                  name:
                    type: string
                    description: simple identifier to be used for the resource
                    example: settlement-report
                  title:
                    type: string
                    description: human readable title or label for the resource
                    example: Settlement Report
                  description:
                    type: string
                    description: human readable description of the resource
                    example: Settlement Report contains application data based on various parameters
                  mediatype:
                    type: string
                    description: expected report response media type
                    example: text/csv
                  data:
                    type: object
                    description: all metadata and data related to a requested report
                    properties:
                      items:
                        type: array
                        description: funding daily summary report csv field
                        items:
                          type: array
                          items:
                            type: string
                      pagination:
                        description: Result pagination values
                        type: object
                        properties:
                          limit:
                            type: integer
                            description: The maximum number of records that will be returned.
                            example: 10
                          offset:
                            type: integer
                            description: The number of records skipped.
                            example: 0
                          total:
                            type: integer
                            description: The total available records.
                            example: 200
                  schema:
                    type: object
                    description: dictates the Header row of a CSV response
                    properties:
                      fields:
                        type: array
                        items:
                          type: object
                          description: describes a field of data returned
                          required:
                          - name
                          properties:
                            name:
                              type: string
                              description: unique value corresponing to the name of field/column present in the data
                              example: date
                            type:
                              type: string
                              description: data type of the corresponding value in the data
                              example: datetime
                example:
                  profile: tabular-data-resource
                  name: funding-daily-summary
                  title: Funding Summary
                  description: Funding daily summary report contains summary data based on various parameters
                  mediatype: text/csv
                  data:
                    items:
                    - - ach_effective_date
                      - merchant_name
                      - program_name
                      - funding_event_count
                      - currency
                      - total_settled_amount
                      - total_refunded_amount
                      - total_chargedback_amount
                      - total_fee_amount
                      - holdover_balance
                      - net_balance
                    - - <ach_effective_date value 1>
                      - <merchant_name value>
                      - '...'
                    - - <ach_effective_date value 2>
                      - <merchant_name value>
                      - '...'
                    pagination:
                      total: 10
                      limit: 10
                      offset: 0
