      description: Extend the current expiration period by 14 days for a valid transaction. This can only be done once and is not enabled be default.
      operationId: extendExpiration
      security:
      - bearerAuthTransaction:
        - u:tx
      parameters:
      - name: transactionID
        in: path
        description: The ID of the transaction to perform the action on
        required: true
        schema:
          type: string
          format: uuid
          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
