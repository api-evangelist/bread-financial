  /api/auth/buyer/token/exchange:
    post:
      tags:
      - Auth
      summary: Exchange Service Account JWT For Buyer JWT
      description: 'This endpoint allows JWTs assigned role `service`, `anonymous`, or `buyer` to be exchanged for a JWT assigned role `buyer`. Request body parameters `programID` and `merchantID` are required if the associated claim(s) are present on the provided JWT.


        Exchanging a service account JWT allows for a service account to perform actions on a user''s behalf if necessary. Buyers should use the checkout flow instead (see `/send/code` + `/buyer/authorize`).


        Exchanging an anonymous JWT allows for new users to login with their recently created buyer account. This is an alternative way of getting a buyer JWT for apps that cannot access the Authorization response header following buyer registration.


        Exchanging a buyer JWT is a special case allowing previously unverified buyers who have recently OTP verified to upgrade their buyer account to reflect that verification.'
      operationId: exchangeBuyerToken
      security:
      - bearerAuth:
        - c:service.buyer.token.exchange
        - c:anonymous.buyer.token.exchange
        - c:buyer.token.exchange
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              required:
              - buyerID
              type: object
              properties:
                buyerID:
                  description: An identifier used to find an existing buyer.
                  type: string
                  format: uuid
                merchantID:
                  format: uuid
                  description: An identifier used to find an existing merchant.
                  type: string
                programID:
                  description: An identifier used to find an existing program.
                  type: string
                  format: uuid
      responses:
        '200':
          description: A response from a successful request to `POST /api/auth/buyer/token/exchange`.
          headers:
            Authorization:
              schema:
                type: string
              description: The generated JWT.
          content:
            application/json:
              schema:
                type: object
                allOf:
                - type: object
                  description: Default error model for Auth errors
                  required:
                  - token
                  - tokenExpiresAt
                  properties:
                    token:
                      description: A JWT.
                      type: string
                    tokenExpiresAt:
                      type: string
                      format: date-time
                      description: The timestamp value formatted per RFC3339. This does not allow nulls.
                      example: '2020-12-31T15:10:55Z'
                      externalDocs:
                        description: RFC3339
                        url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
                    tokenType:
                      description: The type of the token.
                      type: string
                      example: Bearer
                properties: {}
        '400':
