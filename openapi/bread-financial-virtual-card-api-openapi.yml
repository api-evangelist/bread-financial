                    description: Type of wallet.
                    type: string
                    enum:
                    - APPLEPAY
                    - GOOGLEPAY
                    example: GOOGLEPAY
                  status:
                    description: 'Provisioning status of a digital wallet token.

                      `PROVISIONING` represents a digital wallet token in the process of provisioning.

                      `ACTIVE` represents a successfully provisioned digital wallet token.

                      `FAILED` represents a digital wallet token that failed provisioning.

                      `SUSPENDED` represents a suspended digital wallet token.  Can be reinstated.

                      `TERMINATED` represents a terminated digital wallet token.  Cannot be reinstated.'
                    type: string
