openapi: 3.2.0
info:
  title: Servicing Disclosures API
  description: Servicing supports a buyer's post purchase journey, enabling viewing and management of payment agreements across all payment products.
  version: 2.0.0
  contact:
    email: partnership-growth@getbread.com
servers:
- url: https://api-preview.platform.breadpayments.com/
  description: Preview environment
- url: https://api.platform.breadpayments.com/
  description: Production environment
tags:
- name: Disclosures
paths:
  /api/disclosure/payment-agreement/{paymentAgreementID}:
    post:
      summary: Generate a set of disclosures
      description: Generate and save a set of specified disclosures for a payment agreement. Returns the disclosure identity information
      operationId: generateDisclosures
      tags:
      - Disclosures
      security:
      - bearerAuthDisclosure:
        - w:disclosure.document
      parameters:
      - in: header
        name: X-API-VERSION
        description: 'X-API-VERSION: Header to specify the API version (i.e. v2)'
        schema:
          type: string
        required: true
      - name: paymentAgreementID
        description: The unique UUID of the payment agreement
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
          example: dc0dc633-1760-4d43-ba1d-da94ed701f06
          externalDocs:
            description: RFC4122
            url: https://datatracker.ietf.org/doc/html/rfc4122.html
      requestBody:
        description: Request body for generating disclosures
        content:
          application/json:
            schema:
              description: The request body for generating multiple documents. Choose one of the disclosure Operations.
              properties:
                disclosureOperation:
                  type: string
                  enum:
                  - CHECKOUT
                  - AUTOPAY_ENROLLMENT
                  - ONE_TIME_PAYMENT
                  - HARDSHIP
                  description: A high level category of the operation being disclosed
                  example: CHECKOUT
                paymentMethodID:
                  allOf:
                  - type: string
                    format: uuid
                    description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
                    example: dc0dc633-1760-4d43-ba1d-da94ed701f06
                    externalDocs:
                      description: RFC4122
                      url: https://datatracker.ietf.org/doc/html/rfc4122.html
                  description: paymentMethodID is required for AutoPay Enrollment and AutoPay Checkout operations.
                paymentAmount:
                  allOf:
                  - required:
                    - currency
                    - value
                    properties:
                      currency:
                        type: string
                        description: The three letter currency code as defined in ISO 4217.
                        example: USD
                        minLength: 3
                        maxLength: 3
                        externalDocs:
                          description: ISO 4217
                          url: https://en.wikipedia.org/wiki/ISO_4217
                      value:
                        type: integer
                        description: 'Monetary value as an integral number of the currency fractional unit e.g for USD: cents'
                        format: int64
                        example: 100
                    description: Represents a monetary amount in the specified currency
                    example:
                      currency: USD
                      value: 50000
                  description: paymentAmount is required for payment operation (or OneTimePayment op).
                nextPaymentDueDate:
                  allOf:
                  - type:
                    - string
                    - 'null'
                    format: date
                    description: The date value formatted per RFC3339. This allows nulls.
                    example: '2020-12-31'
                    externalDocs:
                      description: RFC3339
                      url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
                  description: Only needed for HARDSHIP disclosure operation
                finalInstallmentDueDate:
                  allOf:
                  - type:
                    - string
                    - 'null'
                    format: date
                    description: The date value formatted per RFC3339. This allows nulls.
                    example: '2020-12-31'
                    externalDocs:
                      description: RFC3339
                      url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
                  description: Only needed for HARDSHIP disclosure operation
                firstSkippedInstallmentDate:
                  allOf:
                  - type:
                    - string
                    - 'null'
                    format: date
                    description: The date value formatted per RFC3339. This allows nulls.
                    example: '2020-12-31'
                    externalDocs:
                      description: RFC3339
                      url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
                  description: Only needed for HARDSHIP disclosure operation
                secondSkippedInstallmentDate:
                  allOf:
                  - type:
                    - string
                    - 'null'
                    format: date
                    description: The date value formatted per RFC3339. This allows nulls.
                    example: '2020-12-31'
                    externalDocs:
                      description: RFC3339
                      url: https://datatracker.ietf.org/doc/html/rfc3339#section-5.6
                  description: Only needed for HARDSHIP disclosure operation
              required:
              - disclosureOperation
            examples:
              Checkout:
                summary: Generate disclosures with checkout disclosure operation
                description: An example of checkout disclosure operation that without causing autopay enrollment
                value:
                  disclosureOperation: CHECKOUT
              Hardship:
                summary: Generate disclosures with for skip payment assistance program
                description: An example of hardship disclosure operation
                value:
                  disclosureOperation: HARDSHIP
                  nextPaymentDueDate: '2022-04-02'
                  finalInstallmentDueDate: '2022-12-02'
                  firstSkippedInstallmentDate: '2022-02-02'
                  secondSkippedInstallmentDate: '2022-03-02'
              CheckoutWithAutopay:
                summary: Generate disclosures with checkout disclosure operation causes autopay enrollment
                description: An example of checkout disclosure operation, requires using `paymentMethodID`
                value:
                  disclosureOperation: CHECKOUT
                  paymentMethodID: cf343a78-4f83-403c-8728-6b37eb3c63cb
              AutopayEnrollment:
                summary: Generate disclosures with autopay disclosure operation
                description: An example of autopay disclosure operation, requires using `paymentMethodID`
                value:
                  disclosureOperation: AUTOPAY_ENROLLMENT
                  paymentMethodID: 35be2b5a-26d4-4d89-a382-144321f4c807
              OneTimePayment:
                summary: Generate disclosures with one-time payment disclosure operation
                description: An example of one-time disclosure operation, requires using `paymentAmount`
                value:
                  disclosureOperation: ONE_TIME_PAYMENT
                  paymentMethodID: 35be2b5a-26d4-4d89-a382-144321f4c807
                  paymentAmount:
                    currency: USD
                    value: 9988
      responses:
        '200':
          description: The response for Generate Disclosure POST request
          content:
            application/json:
              schema:
                type: object
                properties:
                  disclosureRef:
                    type: string
                    description: A checksum string to be returned as an acknowledgment for the disclosure operation e.g. Checkout
                    example: 75e5d039-ea4b-4d29-bdd0-818aeb2697ae:a719f1b9-ee9f-4bf5-b824-c59e97153a89
                  disclosures:
                    type: array
                    description: References to the generated disclosure documents
                    items:
                      type: object
                      description: The response body for one disclosure generated as part of a request to generate multiple disclosures
                      properties:
                        disclosureID:
                          allOf:
                          - type: string
                            format: uuid
                            description: A universally unique identifier (Version 4) as defined in RFC4122. This does not allow nulls.
                            example: dc0dc633-1760-4d43-ba1d-da94ed701f06
                            externalDocs:
                              description: RFC4122
                              url: https://datatracker.ietf.org/doc/html/rfc4122.html
                          description: The unique UUID of the generated disclosure
                        disclosureName:
                          allOf:
                          - description: A symbol identifying a disclosure document type
                            type: string
                            enum:
                            - loan-agreement
                            - loan-agreement-sp
                            - cob-activation
                            - cob-maintenance
                            - one-time
                            - auto-enroll
                            - auto-enroll-sp
                            - auto-enroll-pending
                            - scheduled-payment
                            - tila
                            - credit-score-notice
                            - auto-enroll-past-due
                            - auto-enroll-past-due-sp
                            - payment-full-terms
                            - copy-of-authorization
                            - copy-of-authorization-sp
                            - checkout-auto-enroll-sp
                            - hardship-confirm-0
                            - hardship-confirm-29
                            - hardship-confirm-59
                            - verification-service
                            - poa
                            - payment-confirm
                            - statement-hyloc
                            - loan-agreement-hyloc
                            - tila-hyloc
                            - auto-enroll-full-terms
                            - statement-di
                            - loan-agreement-di
                            - tila-di
                            - ''
                            example: loan-agreement
                          description: The name of the generated disclosure
                        documentURL:
                          type: string
                          description: A URL at which the document can be viewed
                          example: /api/disclosure/document/tila/payment-agreement/75e5d039-ea4b-4d29-bdd0-818aeb2697ae
                      required:
                      - disclosureID
                      - disclosureName
                      - documentURL
                      example:
                        disclosureID: 059d039e-9ae1-4387-9af7-c3543990b5a6
                        disclosureName: tila
                        documentURL: /api/disclosure/document/tila/payment-agreement/75e5d039-ea4b-4d29-bdd0-818aeb2697ae
        '400':
          description: ''
          content:
            application/json:
              schema:
